apiVersion: apps/v1
kind: Deployment

metadata:
  name: myapp-deployment
  labels:
    app: nginx
    tier: frontend

spec:
  selector:
    matchLabels:
      tier: frontend
  replicas: 4
  template:
    metadata:
      name: nginx-app
      labels:
        name: nginx
        tier: frontend

    spec:
      containers:
        - name: nginx-container
          image: nginx:1.13.err
